AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for Amazon Bedrock Knowledge Base with S3 Vectors storage'

Parameters:
  KnowledgeBaseName:
    Type: String
    Description: The name of the Knowledge Base
    Default: customer-support-kb
    MinLength: 1
    MaxLength: 50
    AllowedPattern: '^([0-9a-zA-Z][_-]?){1,50}$'
    ConstraintDescription: Must be a valid Knowledge Base name (alphanumeric, hyphens, underscores, max 50 chars)

  KnowledgeBaseDescription:
    Type: String
    Description: Description of the Knowledge Base
    Default: Customer Support Knowledge Base for product manuals and policies
    MinLength: 1
    MaxLength: 200

  EmbeddingModel:
    Type: String
    Description: The embedding model to use for the Knowledge Base
    Default: amazon.titan-embed-text-v2:0
    AllowedValues:
      - amazon.titan-embed-text-v1
      - amazon.titan-embed-text-v2:0
      - cohere.embed-english-v3
      - cohere.embed-multilingual-v3

  Suffix:
    Type: String
    Description: Unique suffix for resource names (use 4 character random string)
    Default: dev1
    MinLength: 4
    MaxLength: 4
    AllowedPattern: '^[a-z0-9]{4}$'
    ConstraintDescription: Must be exactly 4 lowercase alphanumeric characters

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Knowledge Base Configuration
        Parameters:
          - KnowledgeBaseName
          - KnowledgeBaseDescription
          - EmbeddingModel
      - Label:
          default: Resource Naming
        Parameters:
          - Suffix
    ParameterLabels:
      KnowledgeBaseName:
        default: Knowledge Base Name
      KnowledgeBaseDescription:
        default: Knowledge Base Description
      EmbeddingModel:
        default: Embedding Model
      Suffix:
        default: Resource Suffix

Resources:
  # IAM Role for Knowledge Base
  BedrockKnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'AmazonBedrockExecutionRoleForKnowledgeBase_${Suffix}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*'
      Description: Amazon Bedrock Knowledge Base Execution Role for accessing S3 and S3 Vectors

  # Policy for Foundation Model Access
  BedrockFoundationModelPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub 'AmazonBedrockFoundationModelPolicyForKnowledgeBase_${Suffix}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - bedrock:InvokeModel
            Resource:
              - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${EmbeddingModel}'
      Roles:
        - !Ref BedrockKnowledgeBaseRole

  # Policy for S3 Data Bucket Access
  BedrockS3DataPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub 'AmazonBedrockS3PolicyForKnowledgeBase_${Suffix}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !Sub 'arn:aws:s3:::${KnowledgeBaseName}-${Suffix}'
              - !Sub 'arn:aws:s3:::${KnowledgeBaseName}-${Suffix}/*'
            Condition:
              StringEquals:
                aws:ResourceAccount: !Ref AWS::AccountId
      Roles:
        - !Ref BedrockKnowledgeBaseRole

  # Policy for S3 Vectors Access
  BedrockS3VectorsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub 'AmazonBedrockS3VectorsPolicyForKnowledgeBase_${Suffix}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3VectorsPermissions
            Effect: Allow
            Action:
              - s3vectors:GetIndex
              - s3vectors:QueryVectors
              - s3vectors:PutVectors
              - s3vectors:GetVectors
              - s3vectors:DeleteVectors
            Resource: !Sub 'arn:aws:s3vectors:${AWS::Region}:${AWS::AccountId}:vector-bucket/${KnowledgeBaseName}-vectors-${Suffix}/index/*'
            Condition:
              StringEquals:
                aws:ResourceAccount: !Ref AWS::AccountId
      Roles:
        - !Ref BedrockKnowledgeBaseRole

  # S3 Bucket for Access Logs
  LoggingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${KnowledgeBaseName}-logs-${Suffix}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireLogs
            Status: Enabled
            ExpirationInDays: 90
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      Tags:
        - Key: Name
          Value: !Sub '${KnowledgeBaseName}-logs-bucket'
        - Key: Purpose
          Value: Access Logging

  # Bucket Policy for Logging Bucket
  LoggingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LoggingBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3ServerAccessLogsPolicy
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${LoggingBucket.Arn}/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # S3 Bucket for Knowledge Base Data
  KnowledgeBaseDataBucket:
    DependsOn: LoggingBucketPolicy
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${KnowledgeBaseName}-${Suffix}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90
          - Id: AbortIncompleteMultipartUpload
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucket
        LogFilePrefix: !Sub '${KnowledgeBaseName}-access-logs/'
      Tags:
        - Key: Name
          Value: !Sub '${KnowledgeBaseName}-data-bucket'
        - Key: Purpose
          Value: Knowledge Base Data Storage

  # S3 Vectors Bucket for Vector Embeddings
  VectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    Properties:
      VectorBucketName: !Sub '${KnowledgeBaseName}-vectors-${Suffix}'
      EncryptionConfiguration:
        SseType: AES256

  # Vector Index within the Vector Bucket
  VectorIndex:
    Type: AWS::S3Vectors::Index
    Properties:
      VectorBucketName: !Sub '${KnowledgeBaseName}-vectors-${Suffix}'
      IndexName: !Sub '${KnowledgeBaseName}-index-${Suffix}'
      DataType: float32
      Dimension: 1024  # Matches amazon.titan-embed-text-v2:0 dimension
      DistanceMetric: cosine
      MetadataConfiguration:
        NonFilterableMetadataKeys:
          - AMAZON_BEDROCK_TEXT

  # Bedrock Knowledge Base
  KnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    DependsOn:
      - BedrockFoundationModelPolicy
      - BedrockS3DataPolicy
      - BedrockS3VectorsPolicy
    Properties:
      Name: !Ref KnowledgeBaseName
      Description: !Ref KnowledgeBaseDescription
      RoleArn: !GetAtt BedrockKnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${EmbeddingModel}'
      StorageConfiguration:
        Type: S3_VECTORS
        S3VectorsConfiguration:
          VectorBucketArn: !GetAtt VectorBucket.VectorBucketArn
          IndexArn: !GetAtt VectorIndex.IndexArn
      Tags:
        Name: !Ref KnowledgeBaseName
        Environment: !Ref Suffix

  # Data Source for Knowledge Base
  KnowledgeBaseDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      Name: !Sub '${KnowledgeBaseName}-datasource'
      Description: !Sub 'Data source for ${KnowledgeBaseName}'
      KnowledgeBaseId: !Ref KnowledgeBase
      DataDeletionPolicy: RETAIN
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt KnowledgeBaseDataBucket.Arn
      VectorIngestionConfiguration:
        ChunkingConfiguration:
          ChunkingStrategy: FIXED_SIZE
          FixedSizeChunkingConfiguration:
            MaxTokens: 512
            OverlapPercentage: 20

Outputs:
  KnowledgeBaseId:
    Description: The ID of the Knowledge Base
    Value: !Ref KnowledgeBase
    Export:
      Name: !Sub '${AWS::StackName}-KnowledgeBaseId'

  KnowledgeBaseArn:
    Description: The ARN of the Knowledge Base
    Value: !GetAtt KnowledgeBase.KnowledgeBaseArn
    Export:
      Name: !Sub '${AWS::StackName}-KnowledgeBaseArn'

  DataSourceId:
    Description: The ID of the Data Source
    Value: !Ref KnowledgeBaseDataSource
    Export:
      Name: !Sub '${AWS::StackName}-DataSourceId'

  DataBucketName:
    Description: The name of the S3 bucket containing Knowledge Base data
    Value: !Ref KnowledgeBaseDataBucket
    Export:
      Name: !Sub '${AWS::StackName}-DataBucketName'

  VectorBucketName:
    Description: The name of the S3 Vectors bucket
    Value: !Ref VectorBucket
    Export:
      Name: !Sub '${AWS::StackName}-VectorBucketName'

  VectorBucketArn:
    Description: The ARN of the S3 Vectors bucket
    Value: !GetAtt VectorBucket.VectorBucketArn
    Export:
      Name: !Sub '${AWS::StackName}-VectorBucketArn'

  VectorIndexArn:
    Description: The ARN of the Vector Index
    Value: !GetAtt VectorIndex.IndexArn
    Export:
      Name: !Sub '${AWS::StackName}-VectorIndexArn'

  BedrockRoleArn:
    Description: The ARN of the Bedrock execution role
    Value: !GetAtt BedrockKnowledgeBaseRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BedrockRoleArn'
